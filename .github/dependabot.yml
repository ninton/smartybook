version: 2
updates:
  # PHP (Composer): 月曜 4:10 JST (すべての更新を1つのPRにまとめる)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # JavaScript (npm): 月曜 04:10 JST (すべての更新を1つのPRにまとめる)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions のアップデート: 月曜 04:10 JST
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:10"
      timezone: "Asia/Tokyo"
