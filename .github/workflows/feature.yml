name: feature

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review # ドラフト⇨レディに変更したとき

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event.pull_request.draft == false # ドラフトでは実行しない
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: setup-ci
        uses: ./.github/actions/setup-ci

      - name: lint
        uses: ./.github/actions/lint
