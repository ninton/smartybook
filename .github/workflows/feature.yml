name: feature

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review # ドラフト⇨レディに変更したとき

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event.pull_request.draft == false # ドラフトでは実行しない
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: setup-ci
        uses: ./.github/actions/setup-ci

      - name: lint
        uses: ./.github/actions/lint

      - name: test
        shell: bash
        run: composer run-script test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # @note Makefile の `make setup` タスクの依存関係と同等の処理を順次実行しています。
      # Makefile: .env ➔ .docker-compose-build ➔ .composer-installed ➔ docker compose up -d
      # CI環境では `docker compose build` の代わりに `docker/bake-action` を使うことで
      # GitHub Actions の GHA レイヤーキャッシュ（type=gha）を有効化しています。
      - name: make setup - start
        run: |
          make .env

      - name: Build with Buildx Bake
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          targets: app
          load: true # ビルドイメージを Docker デーモンにロード
          set: |
            app.tags=smartybook-app:latest
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: make setup - end
        run: |
          docker compose up --no-build -d app db
          docker compose run --rm app bash scripts/chmod.sh
          docker compose run --rm app composer install

      - name: Wait for Web Server to be ready
        run: |
          # Web サーバーが応答するまで最大 30 秒待機
          set -a
          . .env
          set +a
          timeout 30s bash -c "until curl -s http://127.0.0.1:${APP_PORT:-3000}/ > /dev/null 2>&1; do sleep 1; done" || true

      - name: Run Golden Master Tests
        run: |
          make php-test-golden-master
