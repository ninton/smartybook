name: lint
description: Lint files (format, lint, static analysis)
runs:
  using: composite
  steps:
    # ========================================
    # ファイル変更検出系
    # ========================================
    - name: Detect changed files
      uses: dorny/paths-filter@v4
      id: paths_filter
      with:
        # 追加・変更されたファイルのリストをスペース区切りで取得する
        list-files: shell
        filters: |
          sh:
            - added|modified: '**/*.{sh,sh.tmpl}'
          docker:
            - added|modified: 'docker/**/Dockerfile'
          js:
            - added|modified: 'smartybook/**/*.{js,mjs,ts,tsx}'
          php:
            - added|modified: 'app/**/*.php'
            - added|modified: 'bootstrap/**/*.php'
            - added|modified: 'smartybook/**/*.php'
            - added|modified: 'tests/**/*.php'
          # actionlint 用なので、prettier用とは別途定義
          github_yaml:
            - added|modified: '.github/**/*.{yml,yaml}'
          # Prettier で管理したいファイル群をひとまとめにする
          # ただし pnpm-lock.yaml は生成物であり、Prettier と整形規則が衝突しやすいため .prettierignore で除外する
          prettier:
            - added|modified: '**/*.{css,yml,yaml,md,json,jsonc}'

    # ========================================
    # Shell スクリプトLint系
    # ========================================
    - name: Run ShellCheck
      if: steps.paths_filter.outputs.sh == 'true'
      shell: bash
      run: shellcheck ${{ steps.paths_filter.outputs.sh_files }}

    # ========================================
    # Hadolint (Dockerfileに変更があった時だけ実行)
    # ========================================
    - name: Run Hadolint
      if: steps.paths_filter.outputs.docker == 'true'
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: ${{ steps.paths_filter.outputs.docker_files }}

    # ========================================
    # CSS, YAML, MD, XML, JSON, JSONC フォーマット系
    # ========================================
    - name: Check format (Prettier)
      if: steps.paths_filter.outputs.prettier == 'true'
      shell: bash
      run: pnpm run format:check ${{ steps.paths_filter.outputs.prettier_files }}

    # ========================================
    # GitHub Actions 定義 リント系
    # ========================================
    - name: Run actionlint
      # GitHub Actions 定義ファイルに変更があった場合のみ実行
      if: steps.paths_filter.outputs.github_yaml == 'true'
      uses: reviewdog/action-actionlint@v1
      with:
        fail_level: warning
        # composite action 側では permissions を宣言できないため、
        # checks: write が必要な github-check は使わない。
        # 呼び出し元ワークフローの権限設定に依存しにくい annotations を使う。
        reporter: github-pr-annotations

    # ========================================
    # JS/TS フォーマット・リント系
    # ========================================
    - name: JS Check formatting
      if: ${{ steps.paths_filter.outputs.js == 'true' }}
      shell: bash
      run: pnpm run format:check ${{ steps.paths_filter.outputs.js_files }}

    # ========================================
    # PHP 構文チェック系
    # ========================================
    - name: PHP syntax check
      shell: bash
      if: ${{ steps.paths_filter.outputs.php == 'true' }}
      run: php -l ${{ steps.paths_filter.outputs.php_files }}

    # ========================================
    # PHP コードフォーマット系
    # ========================================
    - name: Run php-cs-fixer
      if: ${{ steps.paths_filter.outputs.php == 'true' }}
      shell: bash
      run: composer run-script format:check ${{ steps.paths_filter.outputs.php_files }}

    # ========================================
    # Smarty テンプレート Lint系
    # ========================================
    - name: Run smarty-lint
      shell: bash
      run: composer run-script smarty-lint templates

    # ========================================
    # PHP 解析系
    # ========================================
    - name: phpstan
      shell: bash
      run: |
        composer run-script lint
