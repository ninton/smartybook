name: lint
description: Lint files (format, lint, static analysis)
runs:
  using: composite
  steps:
    # ========================================
    # Shell スクリプトLint系
    # ========================================
    - name: Run ShellCheck
      shell: bash
      run: |
        set -euo pipefail
        find scripts -name "*.sh" -or -name "*.sh.tmpl" | xargs -r -L1 shellcheck

    # ========================================
    # Hadolint
    # ========================================
    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: "docker/php-web/Dockerfile"

    # ========================================
    # CSS, YAML, MD, XML, JSON, JSONC, JS/TS フォーマット系
    # ========================================
    - name: Check format (Prettier)
      shell: bash
      run: pnpm run format:check .

    # ========================================
    # GitHub Actions 定義 リント系
    # ========================================
    - name: Run actionlint
      uses: reviewdog/action-actionlint@v1
      with:
        fail_level: warning
        # composite action 側では permissions を宣言できないため、
        # checks: write が必要な github-check は使わない。
        # 呼び出し元ワークフローの権限設定に依存しにくい annotations を使う。
        reporter: github-pr-annotations

    # ========================================
    # JS/TS リント系
    # ========================================
    - name: ESLint
      shell: bash
      run: pnpm run lint smartybook

    - name: ts-check
      shell: bash
      run: pnpm run ts-check

    # ========================================
    # PHP 構文チェック系
    # ========================================
    - name: PHP syntax check
      shell: bash
      run: |
        set -euo pipefail
        find app -name "*.php" | xargs -r -L1 php -l
        find bootstrap -name "*.php" | xargs -r -L1 php -l
        find smartybook -name "*.php" | xargs -r -L1 php -l
        find tests -name "*.php" | xargs -r -L1 php -l

    # ========================================
    # PHP コードフォーマット系
    # ========================================
    - name: Run php-cs-fixer
      shell: bash
      run: composer run-script format:check

    # ========================================
    # Smarty テンプレート Lint系
    # ========================================
    - name: Run smarty-lint
      shell: bash
      run: composer run-script smarty-lint templates

    # ========================================
    # PHP 解析系
    # ========================================
    - name: phpstan
      shell: bash
      run: |
        composer run-script lint
