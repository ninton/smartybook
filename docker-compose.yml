services:
  app:
    tty: true
    build: docker/app
    # ホスト側ポートは環境変数APP_PORTで指定（未定義の場合は3000）
    ports:
      - target: 80
        published: ${APP_PORT:-3000}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - .:/var/www/html:cached
    depends_on:
      - db

  db:
    image: mariadb:12.2
    # ホストへは公開しない（ports 未設定）。DB操作は Docker ネットワーク経由で実施する。
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:-smartybook}

    volumes:
      # 永続化 ホストのパスではなく、ボリューム名（db-data）を指定
      - db_data:/var/lib/mysql
      # 初期化スクリプト（読み取り専用：安全）
      - ./docker/db/init:/docker-entrypoint-initdb.d
      # 設定ファイル（読み取り専用：確実）
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro

  pma:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
    depends_on:
      - db
    # ホスト側ポートは自動割り当て（published: "0"）。割り当て結果は `docker compose ps pma` で確認する。
    ports:
      - target: 80
        published: ${PMA_PORT:-3001}
        host_ip: 127.0.0.1
        protocol: tcp

volumes:
  db_data:
