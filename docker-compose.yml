services:
  app:
    tty: true
    build:
      context: docker/app
      args:
          USER_ID: ${UID:-1000}
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    # ホスト側ポートは環境変数APP_PORTで指定（未定義の場合は3000）
    ports:
      - target: 80
        published: ${APP_PORT:-3000}
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: "client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal} client_port=${XDEBUG_PORT:-9003}"
    volumes:
      - .:/var/www/html:cached
    extra_hosts:
      # Xdebug の接続先（xdebug.client_host=host.docker.internal）として使用
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mariadb:13.0
    # ホストへは公開しない（ports 未設定）。DB操作は Docker ネットワーク経由で実施する。
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-smartybook}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}

    volumes:
      # 永続化 ホストのパスではなく、ボリューム名（db-data）を指定
      - db_data:/var/lib/mysql
      # 初期化スクリプト（読み取り専用：安全）
      - ./docker/db/init:/docker-entrypoint-initdb.d
      # 設定ファイル（読み取り専用：確実）
      - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf:ro

  pma:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
    depends_on:
      - db
    # ホスト側ポートは環境変数 PMA_PORT（未指定時は 3001）を使用。
    ports:
      - target: 80
        published: ${PMA_PORT:-3001}
        host_ip: 127.0.0.1
        protocol: tcp

volumes:
  db_data:
